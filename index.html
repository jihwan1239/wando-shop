<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="청해진 건어물">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7ecd6">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>청해진 건어물</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
:root{--bg:#f7ecd6;--panel:#fffaf0;--ink:#3b2a2a;--sub:#8a6f5c;--line:#e3cfae;--blue:#4a88c7;--red:#e2574c;--green:#5a9a5e;--coin:#f0b840}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Galmuri11','Galmuri9',system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit}
#app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.hud{display:flex;align-items:center;gap:8px;padding:10px 12px 8px}
.hud .title{flex:1;min-width:0}
.hud .name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .rank{font-size:11px;color:var(--sub);margin-top:3px}
.coins{display:flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--ink);border-radius:8px;padding:6px 10px;font-size:14px;box-shadow:0 2px 0 var(--ink)}
.coin{width:12px;height:12px;background:var(--coin);border:2px solid #b07a20;border-radius:50%}
.icon-btn{width:36px;height:36px;border:2px solid var(--ink);background:var(--panel);border-radius:8px;font-size:15px;box-shadow:0 2px 0 var(--ink)}
.icon-btn.off{opacity:.45}
.hud,.tabs{flex:none}
.stage{flex:none;position:relative;line-height:0;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);background:#d7c3a0;display:flex;justify-content:center}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(59,42,42,.88);color:#fffaf0;font-size:12px;line-height:1.4;padding:7px 12px;border-radius:8px;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1}
.tabs{display:flex;gap:6px;padding:10px 12px 0}
.tabs button{flex:1;padding:9px 0;border:2px solid var(--ink);border-bottom:none;background:#ead9b8;border-radius:8px 8px 0 0;font-size:13px}
.tabs button.on{background:var(--panel);font-weight:700}
#panel{background:var(--panel);border:2px solid var(--ink);margin:0 12px 10px;border-radius:0 0 10px 10px;padding:12px;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.hint{font-size:12px;color:var(--sub);line-height:1.6;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:none}
.row img{width:40px;height:40px;image-rendering:pixelated;background:#f3e6cc;border-radius:6px;padding:2px}
.row .info{flex:1;min-width:0}
.row .info b{font-size:14px}
.row .info small{display:block;font-size:11px;color:var(--sub);margin-top:4px;line-height:1.5}
.row.locked img{filter:grayscale(1) brightness(.6);opacity:.6}
.btn{border:2px solid var(--ink);background:var(--blue);color:#fff;border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 2px 0 var(--ink);white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn[disabled]{background:#cfc2aa;color:#7d6c5c;box-shadow:none}
.btn.red{background:var(--red)}
.btn.green{background:var(--green)}
.btn.ghost{background:var(--panel);color:var(--ink)}
.btn.big{display:block;width:100%;padding:13px;font-size:14px;margin-top:10px}
.lv{font-size:11px;color:var(--sub);margin-left:4px}
.shopcard{text-align:center;padding:6px 4px}
.shopcard .sign{display:inline-block;background:#f6e7c8;border:3px solid #7a5236;padding:8px 16px;font-size:17px;font-weight:700;border-radius:4px;margin-bottom:10px}
.shopcard p{font-size:13px;line-height:1.7;margin:6px 0;color:var(--ink)}
.shopcard .meta{font-size:12px;color:var(--sub);margin-top:4px}
.shopcard .meta a{color:var(--blue)}
.stats{display:flex;gap:8px;margin-top:14px}
.stats div{flex:1;background:#f3e6cc;border-radius:8px;padding:10px 6px;text-align:center;font-size:11px;color:var(--sub)}
.stats b{display:block;font-size:15px;color:var(--ink);margin-top:4px}
.reset{display:block;margin:18px auto 0;background:none;border:none;color:var(--sub);font-size:11px;text-decoration:underline}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(40,28,20,.45)}
.sheet-card{position:relative;width:100%;max-width:480px;background:var(--panel);border:2px solid var(--ink);border-bottom:none;border-radius:14px 14px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:80dvh;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sheet-card h3{margin:0 0 6px;font-size:16px}
.sheet-card .sub{font-size:12px;color:var(--sub);line-height:1.6;margin-bottom:8px}
.story .chap{display:inline-block;font-size:11px;color:#fffaf0;background:#4a88c7;border:2px solid var(--ink);border-radius:6px;padding:4px 8px;margin-bottom:12px}
.say{display:flex;gap:12px;align-items:flex-start;min-height:96px}
.say .portrait{width:60px;height:96px;image-rendering:pixelated;background:#f3e6cc;border:2px solid var(--ink);border-radius:8px;padding:8px 5px;flex:none;object-fit:contain}
.say .txt{flex:1}
.say .who{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px}
.say .line{font-size:15px;line-height:1.75}
.say.plain{align-items:center;justify-content:center;text-align:center;padding:10px 6px}
.say.plain .line{color:#5a4636}
.say.help{background:#eef4fa;border-radius:8px}
.say.help .who{color:#4a88c7}
.dots{text-align:right;font-size:11px;color:var(--sub);margin-top:8px}
.replay{margin-top:18px;text-align:left}
.replay .rt{font-size:12px;color:var(--sub);margin-bottom:8px}
.chip{display:inline-block;font-family:inherit;font-size:11px;border:2px solid var(--ink);background:#f3e6cc;border-radius:14px;padding:5px 9px;margin:0 4px 6px 0;color:var(--ink)}
.chip.off{opacity:.4;border-style:dashed}
.bar{height:8px;background:#ead9b8;border-radius:4px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--green)}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="title"><div class="name" id="hudName"></div><div class="rank" id="hudRank"></div></div>
    <div class="coins"><span class="coin"></span><b id="hudCoins">0</b>원</div>
    <button id="btnSound" class="icon-btn" aria-label="소리">♪</button>
  </header>
  <div class="stage"><canvas id="cv"></canvas><div id="toast"></div></div>
  <nav class="tabs">
    <button data-tab="stock" class="on">창고</button>
    <button data-tab="up">가게 키우기</button>
    <button data-tab="shop">우리 가게</button>
  </nav>
  <section id="panel"></section>
</div>
<div id="sheet" class="sheet hidden"><div class="sheet-bg"></div><div class="sheet-card" id="sheetCard"></div></div>

<script>
/* =========================================================
   실제 가게 정보 — 여기만 바꾸면 게임 전체에 반영돼요
   ========================================================= */
const CONFIG = {
  shopName: '청해진 건어물',         // 게임 속 가게 이름 (간판)

  shopUrl: 'https://naver.me/GSgVA9Op', // 실제 가게 링크 (네이버)
  shopAddress: '경기 성남시 수정구 수정북로 28 1층',
  shopPhone: '010-9437-4367',
  supportAccount: '',                // 비워두면 응원 버튼이 안 보여요

/* ---------------- 데이터 ---------------- */
const PRODUCTS = [
  {id:'anchovy', name:'멸치',   price:8,   cost:15,  time:10, batch:5, unlock:0,     note:'완도 앞바다 멸치, 볶음도 국물도'},
  {id:'miyeok',  name:'미역',   price:20,  cost:40,  time:18, batch:5, unlock:150,   note:'해녀 이모가 물질해서 딴 미역'},
  {id:'dasima',  name:'다시마', price:35,  cost:70,  time:25, batch:5, unlock:600,   note:'국물 맛의 비밀, 하얀 가루는 맛이에요'},
  {id:'gim',     name:'김',     price:60,  cost:120, time:35, batch:5, unlock:2000,  note:'겨울 바다 김발에서 온 김'},
  {id:'squid',   name:'오징어', price:110, cost:220, time:50, batch:5, unlock:6000,  note:'선장님 배에서 바로 받은 오징어'},
  {id:'abalone', name:'건전복', price:180, cost:350, time:70, batch:5, unlock:15000, note:'완도의 자랑, 선물용으로 인기'},
];
const PM = Object.fromEntries(PRODUCTS.map(p=>[p.id,p]));

const UPS = [
  {id:'rack',  name:'건조대 늘리기',    max:4, cost:l=>[120,450,1500,5000][l], desc:()=>`말릴 칸이 하나 늘어요 (${slotCount()}칸)`},
  {id:'fan',   name:'선풍기 놓기',      max:5, cost:l=>Math.round(90*Math.pow(2.3,l)),  desc:()=>'건어물이 10% 더 빨리 말라요'},
  {id:'pack',  name:'예쁜 포장',        max:8, cost:l=>Math.round(160*Math.pow(2.2,l)), desc:()=>'판매가가 15% 올라요'},
  {id:'sign',  name:'간판 꾸미기',      max:6, cost:l=>Math.round(130*Math.pow(2.1,l)), desc:()=>'손님이 더 자주 와요'},
  {id:'staff', name:'알바생 고용',      max:1, cost:()=>900,  desc:()=>'손님을 알아서 응대해요. 자리 비워도 팔아요'},
  {id:'auto',  name:'자동 건조 시스템', max:1, cost:()=>3000, desc:()=>'다 마르면 알아서 거두고 다시 걸어요'},

const RANKS = [[0,'항구 앞 작은 가게'],[3000,'완도항 단골집'],[20000,'섬마을 명물'],[80000,'남도 건어물 맛집'],[300000,'전국구 완도 건어물']];
const KEEPER_LINES = ['어서오세요~','완도 바람이 다 말려줬어요','다시마는 국물용으로 최고예요','건전복은 선물용으로 인기예요','청산도 가시는 길이세요?','천천히 구경하세요~'];
const WET={t:'#e7b98a',s:'#a9c1d1',v:'#7d9db8',g:'#335a45',G:'#5a8060',a:'#6f7046',b:'#d99a69',y:'#e4c486',p:'#f7a98a',j:'#c9a888'};

/* ---------------- 등장인물, 이야기 ---------------- */
const CAST={
  me:     {name:'나',         pal:{c:'#d8584c',h:'#5a4030'}},
  halmae: {name:'금순 할머니', pal:{c:'#9b6fb0',h:'#d6d0c6'}},
  haenyeo:{name:'해녀 이모',   pal:{c:'#2f3e55',h:'#2a2222',f:'#f0c49c'}},

  dongsu: {name:'알바생 동수', pal:{c:'#9ccf8a',h:'#3a2a20'}},
  narr:   {name:''},
  help:   {name:'도움말'},
};
const STORY={
  prologue:{title:'프롤로그. 완도로',lines:[
    ['narr','서울살이 3년째. 야근하고 돌아온 밤, 완도 할머니한테서 전화가 왔다.'],
    ['halmae','아가, 할미가 허리를 좀 삐끗했어야. 한 달만 가게 좀 봐줄 수 있겄냐?'],
    ['narr','그렇게 짐을 싸서 내려온 완도항. 바닷바람 냄새가 어릴 때 그대로다.'],
    ['halmae','건조대 두 칸이랑 멸치 한 바구니. 이게 우리 청해진 건어물 밑천이여. 천천히 해봐.'],
    ['me','일단 손님 오면 웃으면서 어서오세요부터 하자.'],
    ['help','건조대 빈칸을 눌러 멸치를 걸어보세요. 다 마르면 눌러서 거두고, 기다리는 손님을 누르면 팔려요.']]},
  gull1:{title:'갈매기 대장 깍깍이',lines:[
    ['narr','하늘에서 수상한 그림자 하나가 건조대 쪽으로 내려온다.'],
    ['me','저 갈매기... 지금 우리 멸치 보고 있는 거 맞지?'],
    ['halmae','깍깍이여, 저놈. 동네 갈매기 대장이여. 보이면 바로 훠이 해야 혀.'],
    ['help','갈매기를 눌러 쫓아내면 보너스를 받아요.']]},
  cat1:{title:'치즈',lines:[
    ['narr','가게 옆 골목에서 노란 고양이가 슬금슬금 다가온다.'],
    ['haenyeo','아따, 치즈 저놈 또 왔네. 동네 사람들이 다 밥 주는디 건어물은 또 따로 챙겨 먹어야.'],
    ['me','이름이 치즈구나. 귀엽긴 한데 우리 건 안 돼!'],
    ['help','고양이도 눌러서 돌려보낼 수 있어요.']]},
  miyeok:{title:'1장. 해녀 이모의 미역',lines:[
    ['haenyeo','니가 금순 언니 손주구나? 오메, 언제 이렇게 컸대.'],
    ['haenyeo','오늘 물질해서 딴 미역이여. 볕 좋을 때 잘 말려서 팔아봐.'],
    ['me','감사해요 이모! 제대로 말려볼게요.']]},
  dasima:{title:'2장. 바람이 반, 햇볕이 반',lines:[
    ['narr','저녁에 할머니한테서 전화가 왔다. 다시마를 들여왔다는 소식을 벌써 들으신 모양이다.'],
    ['halmae','다시마는 서두르면 안 돼야. 바람이 반, 햇볕이 반이여.'],

  ending:{title:'에필로그. 완도 사람',lines:[
    ['halmae','할미가 평생 지킨 가게를 니가 이렇게 키울 줄은 몰랐다.'],

const BGM={playing:false,master:null,timer:null,step:0,next:0,wave:null};
const BPM=92,EIGHTH=60/BPM/2;
// [시작(8분음표 단위), 음높이(MIDI), 길이]
const MELODY=[[0,76,2],[2,79,1],[3,81,1],[4,79,2],[6,76,2],
  [8,72,2],[10,74,1],[11,76,1],[12,69,4],
  [16,69,1],[17,72,1],[18,74,2],[20,72,1],[21,69,1],[22,72,2],

  [48,72,2],[50,74,2],[52,76,1],[53,79,1],[54,74,2],
  [56,72,6]];
const CHORDS=[[48,52,55],[45,48,52],[41,45,48],[43,47,50],[48,52,55],[45,48,52],[41,45,48],[48,52,55]];
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(freq,t,dur,type,vol,dest){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.05);
}
function marimba(m,t,len){
  const d=Math.max(.45,len*EIGHTH*1.4);
  tone(mtof(m),t,d,'triangle',.22,BGM.master);
  tone(mtof(m)*4,t,.12,'sine',.04,BGM.master);
}
function scheduleStep(s,t){
  const bar=Math.floor(s/8),beat=s%8;
  for(const [st,m,len] of MELODY)if(st===s)marimba(m,t,len);
  let ch=CHORDS[bar];if(bar===6&&beat>=4)ch=[43,47,50];
  const arp=[0,2,1,2,0,2,1,2][beat];
  tone(mtof(ch[arp]+12),t,.35,'sine',.07,BGM.master);
  if(beat===0||beat===4)tone(mtof(ch[0]-12),t,EIGHTH*3.5,'triangle',.16,BGM.master);
  if(beat%2===1)tone(5200,t,.03,'square',.006,BGM.master);
}
function startWaves(){
  const len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=480;
  const g=AC.createGain();g.gain.value=.05;
  const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.11;lg.gain.value=.045;
  lfo.connect(lg);lg.connect(g.gain);
  src.connect(lp);lp.connect(g);g.connect(BGM.master);src.start();lfo.start();
  BGM.wave=[src,lfo];
}
function bgmStart(){
  if(!S.bgm||BGM.playing||!ensureAC())return;
  BGM.master=AC.createGain();BGM.master.connect(AC.destination);
  BGM.master.gain.setValueAtTime(0,AC.currentTime);BGM.master.gain.linearRampToValueAtTime(.55,AC.currentTime+1.5);
  BGM.playing=true;BGM.step=0;BGM.next=AC.currentTime+.1;
  startWaves();
  BGM.timer=setInterval(()=>{
    if(BGM.next<AC.currentTime-.05)BGM.next=AC.currentTime+.05;
    while(BGM.next<AC.currentTime+.3){scheduleStep(BGM.step,BGM.next);BGM.next+=EIGHTH;BGM.step=(BGM.step+1)%64;
      if(BGM.step===0)BGM.next+=EIGHTH*2;}
  },80);
}
function bgmStop(){
  if(!BGM.playing)return;
  clearInterval(BGM.timer);BGM.playing=false;if(silentEl)silentEl.pause();
  const m=BGM.master,w=BGM.wave;
  m.gain.cancelScheduledValues(AC.currentTime);m.gain.setValueAtTime(m.gain.value,AC.currentTime);m.gain.linearRampToValueAtTime(0,AC.currentTime+.6);
  setTimeout(()=>{try{w.forEach(n=>n.stop());m.disconnect()}catch(e){}},700);
}

    const occ=[...Array(slotCount()).keys()].filter(i=>S.slots[i].p);
    if(occ.length){const top=occ.filter(i=>i<3);const i=pick(top.length?top:occ);const p=slotPos(i);
      gull={x:W+12,y:4,tx:p.x-1,ty:p.line-6,slot:i,state:'in',t:0,carry:null};queueStory('gull1')}
  }
  if(gull){
    gull.t+=dt;
    if(gull.state==='in'){
      const dx=gull.tx-gull.x,dy=gull.ty-gull.y,dist=Math.hypot(dx,dy),sp=16*dt;
      if(dist<=sp){
        const sl=S.slots[gull.slot];
        if(sl.p){gull.carry=sl.p;toast(`앗, 갈매기가 ${PM[sl.p].name}를 물고 갔어요`);sl.p=null;sl.t=0;sl.done=false;blip(300,.15,'sawtooth',.03)}
        gull.state='flee';
      }else{gull.x+=dx/dist*sp;gull.y+=dy/dist*sp}
    }else{gull.x+=55*dt;gull.y-=35*dt;if(gull.y<-14||gull.x>W+14)gull=null}
  }

  // 고양이
  catT-=dt;
  if(catT<=0&&!cat){
    catT=rand(60,110);
    const any=PRODUCTS.some(p=>S.stock[p.id]>0)||[3,4,5].some(i=>i<slotCount()&&S.slots[i].p);
    if(any){cat={x:-14,y:162,state:'in',t:0,carry:null};queueStory('cat1')}
  }
  if(cat){
    cat.t+=dt;
    if(cat.state==='in'){
      cat.x+=13*dt;
      if(cat.x>=134){
        const occ=[3,4,5].filter(i=>i<slotCount()&&S.slots[i].p);
        if(occ.length){const i=pick(occ);cat.carry=S.slots[i].p;toast(`냥! 고양이가 ${PM[cat.carry].name}를 물고 도망갔어요`);S.slots[i].p=null;S.slots[i].t=0;S.slots[i].done=false}
        else{const st=PRODUCTS.filter(p=>S.stock[p.id]>0);if(st.length){const p=pick(st);S.stock[p.id]-=Math.min(2,S.stock[p.id]);cat.carry=p.id;toast(`냥! 고양이가 ${p.name}를 슬쩍했어요`)}}
        cat.state='flee';blip(500,.1,'triangle');
      }
    }else{cat.x-=45*dt;if(cat.x<-16)cat=null}
  }

  for(const p of parts){p.t+=dt;p.y-=14*dt}
  parts=parts.filter(p=>p.t<p.life);
  if(say){say.t-=dt;if(say.t<=0)say=null}
  saveT+=dt;if(saveT>5){saveT=0;save()}
}

function blendRGB(a,b,k){

      ${CONFIG.shopAddress?`<div class="meta">${CONFIG.shopAddress}</div>`:''}
      ${CONFIG.shopPhone?`<div class="meta"><a href="tel:${CONFIG.shopPhone.replace(/-/g,'')}">${CONFIG.shopPhone}</a></div>`:''}
      <button class="btn red big" data-act="visit">진짜 가게 구경하러 가기</button>
      ${CONFIG.supportAccount?`<button class="btn ghost big" data-act="support">사장님께 응원 보내기</button>`:''}
      <div class="stats"><div>누적 매출<b>${fmt(S.totalEarned)}원</b></div><div>모신 손님<b>${fmt(S.served)}명</b></div><div>지킨 건어물<b>${fmt(S.shooed)}번</b></div></div>
      <div class="replay"><div class="rt">지난 이야기 다시 보기</div>
        ${STORY_ORDER.map(id=>S.story[id]?`<button class="chip" data-act="replay" data-id="${id}">${STORY[id].title}</button>`:`<span class="chip off">???</span>`).join('')}</div>
      <button class="reset" data-act="reset">처음부터 다시 하기</button></div>`;
  }
}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');tab=b.dataset.tab;renderPanel(true)}));

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  if(b.closest('#sheet')&&performance.now()-sheetOpenedAt<300)return;
  const a=b.dataset.act,id=b.dataset.id,slot=+b.dataset.slot;
  if(a==='close')closeSheet();
  else if(a==='storynext'){if(storyIdx<STORY[storyCur.id].lines.length-1){storyIdx++;renderStory()}else closeSheet();return}
  else if(a==='replay'){playStory(id);return}
  else if(a==='tbgm'){S.bgm=!S.bgm;if(S.bgm){unlockAudio()}else bgmStop();save();refreshSoundBtn();soundSheet();sheetOpenedAt=0;return}
  else if(a==='tsfx'){S.sound=!S.sound;if(S.sound)blip(880,.06);save();refreshSoundBtn();soundSheet();sheetOpenedAt=0;return}
  else if(a==='hang'){if(hang(slot,id))closeSheet()}
  else if(a==='clear'){const sl=S.slots[slot];sl.p=null;sl.t=0;sl.done=false;closeSheet()}
  else if(a==='unlock'){const p=PM[id];if(S.coins>=p.unlock){S.coins-=p.unlock;S.unlocked[id]=true;toast(`${p.name}를 들여왔어요!`);sfxCoin();queueStory(id);save()}}
  else if(a==='up'){const u=UPS.find(x=>x.id===id),l=S.up[id],c=u.cost(l);if(l<u.max&&S.coins>=c){S.coins-=c;S.up[id]++;toast(`${u.name} 완료!`);sfxCoin();if(id==='staff')queueStory('staff');save()}}
  else if(a==='visit'){if(CONFIG.shopUrl)window.open(CONFIG.shopUrl,'_blank');else toast('가게 링크는 곧 열려요!')}
  else if(a==='support'){navigator.clipboard&&navigator.clipboard.writeText(CONFIG.supportAccount);toast('계좌번호를 복사했어요. 응원 감사합니다!')}
  else if(a==='reset'){openSheet(`<h3>처음부터 다시 할까요?</h3><div class="sub">모은 돈과 가게 성장 기록이 모두 사라져요.</div>
    <button class="btn red big" data-act="reset2">네, 다시 할래요</button><button class="btn ghost big" data-act="close">아니요</button>`)}
  else if(a==='reset2'){S=fresh();customers=[];gull=null;cat=null;storyQ=[];save();closeSheet();queueStory('prologue');renderPanel(true)}
  renderPanel(true);
});
function soundSheet(){
  openSheet(`<h3>소리 설정</h3><div class="sub">바닷가 배경음악과 효과음을 따로 켜고 끌 수 있어요.</div>
    <div class="row"><div class="info"><b>배경음악</b><small>마림바 멜로디와 파도 소리</small></div>
      <button class="btn ${S.bgm?'':'ghost'}" data-act="tbgm">${S.bgm?'켜짐':'꺼짐'}</button></div>
    <div class="row"><div class="info"><b>효과음</b><small>동전, 손님, 갈매기 소리</small></div>
      <button class="btn ${S.sound?'':'ghost'}" data-act="tsfx">${S.sound?'켜짐':'꺼짐'}</button></div>
    <button class="btn big" data-act="close">닫기</button>`);
}
function refreshSoundBtn(){$('#btnSound').classList.toggle('off',!S.sound&&!S.bgm)}
$('#btnSound').addEventListener('click',soundSheet);
refreshSoundBtn();
$('#hudName').textContent=CONFIG.shopName;

/* ---------------- 자리 비운 동안 ---------------- */
function applyOffline(){
  const now=Date.now();let el=(now-(S.lastSave||now))/1000;
  if(el<60)return;
  el=Math.min(el,3*3600);
  let made=0,spent=0,earned=0,sold=0;
  for(let i=0;i<slotCount();i++){
    const sl=S.slots[i];if(!sl.p)continue;const p=PM[sl.p],te=timeEff(p);
    if(S.up.auto){const rem=el+sl.t;const cyc=Math.min(400,Math.floor(rem/te));S.stock[p.id]+=cyc*p.batch;made+=cyc*p.batch;spent+=cyc*p.cost;sl.t=rem-cyc*te;sl.done=false}
    else{sl.t=Math.min(te,sl.t+el);if(sl.t>=te)sl.done=true}
  }
  if(S.up.staff){
    let demand=Math.floor(el/spawnInt()*2*.6);
    const ids=PRODUCTS.filter(p=>S.stock[p.id]>0).map(p=>p.id).sort((a,b)=>PM[b].price-PM[a].price);
    while(demand>0&&ids.some(id=>S.stock[id]>0)){for(const id of ids){if(demand<=0)break;if(S.stock[id]>0){S.stock[id]--;demand--;sold++;earned+=priceEff(PM[id])}}}
    S.served+=Math.round(sold/2);
  }
  S.coins=Math.max(0,S.coins+earned-spent);S.totalEarned+=earned;
  S.clock+=el;
  const h=Math.floor(el/3600),m=Math.floor(el%3600/60);
  const done=[...Array(slotCount()).keys()].filter(i=>S.slots[i].done).length;
  if(earned>0||made>0||done>0){
    openSheet(`<h3>다녀오셨어요!</h3><div class="sub">${h?h+'시간 ':''}${m}분 동안 가게는 이렇게 지냈어요.</div>
      ${sold?`<div class="row"><div class="info"><b>알바생이 판 건어물 ${fmt(sold)}개</b><small>매출 ${fmt(earned)}원</small></div></div>`:''}
      ${made?`<div class="row"><div class="info"><b>새로 말린 건어물 ${fmt(made)}개</b><small>재료비 ${fmt(spent)}원</small></div></div>`:''}
      ${done?`<div class="row"><div class="info"><b>다 마른 칸 ${done}개</b><small>건조대를 눌러 거둬주세요</small></div></div>`:''}
      <button class="btn big" data-act="close">가게 문 열기</button>`);
  }
}

/* ---------------- 시작 ---------------- */
let last=performance.now(),coinShown=-1;
function loop(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(!storyCur)update(dt);
  checkMilestones();pumpStory();draw();
  if(Math.floor(S.coins)!==coinShown){coinShown=Math.floor(S.coins);$('#hudCoins').textContent=fmt(S.coins)}
  $('#hudRank').textContent=rankName();
  renderPanel(false);
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){save();if(AC)AC.suspend();if(silentEl)silentEl.pause()}
  else{last=performance.now();if(AC)AC.resume().catch(()=>{});if(silentEl&&BGM.playing)silentEl.play().catch(()=>{});applyOffline()}
});
window.addEventListener('pagehide',save);

applyOffline();
queueStory('prologue');
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{resize();renderPanel(true);requestAnimationFrame(loop)});
</script>
