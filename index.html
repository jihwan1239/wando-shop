<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="청해진 건어물">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7ecd6">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>청해진 건어물</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
:root{--bg:#f3e4c8;--panel:#fff8ee;--ink:#4a2f24;--sub:#8a6a55;--line:#6b4433;--soft:#e8d3b0;
  --blue:#4a88c7;--red:#e2574c;--green:#5aa25e;--gold:#e8a923;--sea:#cfe8ef}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);
  font-family:'Galmuri11','Galmuri9',system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit;cursor:pointer}
img{image-rendering:pixelated}
#app{height:100vh;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}

/* 위쪽 상태 바 */
#hud{display:flex;align-items:center;gap:5px;padding:10px 0 8px;flex:none}
.stat{display:flex;align-items:center;gap:5px;background:var(--panel);border:2px solid var(--line);border-radius:2px;
  box-shadow:0 2px 0 var(--line);padding:4px 8px 4px 6px;font-size:14px;height:34px;flex:none;position:relative}
.stat img{width:20px;height:20px}
#lvBtn{gap:6px;font-size:13px}
#lvBtn .xp{width:44px;height:8px;background:var(--soft);border:2px solid var(--line);display:block;position:relative;overflow:hidden}
#lvBtn .xp i{position:absolute;left:0;top:0;bottom:0;width:0;background:#f0b840;transition:width .3s}
#lvBtn .qd{font-size:11px;color:var(--sub);padding-left:6px;border-left:1px solid #d9bfa0}
#hud .spacer{flex:1}
#hud .icon{width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;flex:none;
  background:var(--panel);border:2px solid var(--line);border-radius:2px;box-shadow:0 2px 0 var(--line)}
#hud .icon img{width:20px;height:20px}
.dot{display:none;position:absolute;top:-5px;right:-5px;width:11px;height:11px;background:#ff5a5a;border:2px solid var(--line);border-radius:50%}
.dot.on{display:block}
@media (max-width:370px){#lvBtn .xp{width:30px} .stat{font-size:12px;padding:4px 6px 4px 5px} #lvBtn .qd{font-size:10px}}

/* 게임 화면 */
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#box{position:relative;line-height:0}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;
  border:3px solid var(--line);border-radius:2px;box-shadow:0 4px 0 var(--line);background:#8fd3f2}
#pill{position:absolute;top:9px;left:50%;transform:translateX(-50%);line-height:1;white-space:nowrap;pointer-events:none;
  background:rgba(255,248,238,.92);border:2px solid var(--line);padding:5px 9px;font-size:11px;display:flex;gap:7px;align-items:center}
#pill span+span{padding-left:7px;border-left:1px solid #d9bfa0;color:var(--sub)}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);line-height:1.45;pointer-events:none;
  background:rgba(74,47,36,.92);color:#fff8ee;font-size:12px;padding:7px 12px;border:2px solid #2f1d16;
  text-align:center;width:max-content;max-width:86%;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
#miniBtn{position:absolute;left:10px;bottom:12px;line-height:1;display:flex;align-items:center;gap:5px;font-size:12px;
  background:#fff3d6;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);padding:5px 9px 5px 6px}
#miniBtn img{width:22px;height:22px}
#miniBtn[hidden]{display:none}

/* 아래쪽 메뉴 */
#bar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:12px 0 12px;flex:none}
#bar button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px 6px;font-size:12px;white-space:nowrap;
  background:var(--panel);border:2px solid var(--line);border-radius:2px;box-shadow:0 3px 0 var(--line)}
#bar button img{width:26px;height:26px}
#bar button:active,.stat:active,#hud .icon:active,.btn:active,#miniBtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
#bar .dot{top:-6px;right:-6px}

/* 창 */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px}
.sheet.hidden{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(60,36,26,.5)}
.win{position:relative;width:100%;max-width:440px;max-height:84dvh;display:flex;flex-direction:column;
  background:var(--panel);border:3px solid var(--line);border-radius:2px;box-shadow:0 5px 0 var(--line);animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}}
.win-h{display:flex;align-items:center;gap:8px;padding:13px 14px 11px;border-bottom:2px dashed #e6c9b4;flex:none}
.win-h img{width:22px;height:22px}
.win-h b{flex:1;font-size:16px;font-weight:400}
.win-h .x{background:none;border:none;font-size:22px;line-height:1;padding:0 2px;color:var(--ink)}
.win-b{padding:12px 14px 14px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.win-b h3{margin:0 0 6px;font-size:15px;font-weight:400}
.sub,.hint{font-size:12px;color:var(--sub);line-height:1.65}
.hint{margin-bottom:10px}
.sec{font-size:12px;color:var(--sub);margin:16px 0 4px;display:flex;align-items:center;gap:6px}
.sec:first-child{margin-top:0}
.sec::after{content:'';flex:1;border-top:1px dashed #e0c6ae}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed #ead7c4}
.row:last-child{border-bottom:none}
.row>img{width:40px;height:40px;background:#f6e6cc;border:2px solid #e2c9a6;padding:2px;flex:none}
.row .info{flex:1;min-width:0}
.row .info b{font-size:14px;font-weight:400}
.row .info small{display:block;font-size:11px;color:var(--sub);margin-top:4px;line-height:1.5}
.row.locked>img{filter:grayscale(1) brightness(.75);opacity:.6}
.lv{font-size:11px;color:var(--sub);margin-left:4px}
.btn{border:2px solid var(--line);background:var(--blue);color:#fff;border-radius:2px;padding:8px 10px;font-size:12px;box-shadow:0 2px 0 var(--line);white-space:nowrap}
.btn[disabled]{background:#e4d5c0;color:#9c8774;box-shadow:none;border-color:#c9b29a}
.btn.red{background:var(--red)}.btn.green{background:var(--green)}.btn.gold{background:var(--gold)}
.btn.ghost{background:var(--panel);color:var(--ink)}
.btn.big{display:block;width:100%;padding:12px;font-size:14px;margin-top:10px}
.bar{height:10px;background:var(--soft);border:2px solid var(--line);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--green)}
.empty{text-align:center;color:var(--sub);font-size:13px;line-height:1.7;padding:22px 6px}
.notice{background:#fff1dc;border:2px dashed #d9a35a;padding:10px 12px;margin:6px 0 10px;line-height:1.6;font-size:13px}
.stamps{display:flex;gap:3px;margin-top:5px;align-items:center}
.stamp{font-size:10px;width:18px;height:18px;line-height:14px;text-align:center;border-radius:50%;border:2px dashed #d7c2a6;color:#cdb79a}
.stamp.got{border-style:solid;color:#fff;border-color:var(--line)}
.itabs{display:flex;gap:5px;margin-bottom:10px}
.itabs button{flex:1;padding:7px 0;font-size:12px;background:#f3e3c8;border:2px solid var(--line);border-radius:2px}
.itabs button.on{background:var(--line);color:#fff8ee}
.chip{display:inline-block;font-family:inherit;font-size:11px;border:2px solid var(--line);background:#f6e6cc;border-radius:2px;padding:5px 8px;margin:0 4px 6px 0;color:var(--ink)}
.chip.off{opacity:.55;border-style:dashed}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.stats div{background:#f6e6cc;border:2px solid #e2c9a6;padding:9px 4px;text-align:center;font-size:11px;color:var(--sub)}
.stats b{display:block;font-size:14px;color:var(--ink);margin-top:4px;font-weight:400}
.reset{display:block;margin:18px auto 0;background:none;border:none;color:var(--sub);font-size:11px;text-decoration:underline}
/* 주문 */
.order{background:#fff1dc;border:2px dashed #d9a35a;padding:12px}
.order .top{display:flex;gap:10px;align-items:flex-start}
.order .top img.pt{width:46px;height:72px;background:var(--panel);border:2px solid var(--line);padding:5px 4px;flex:none}
.order .who{font-size:12px;color:var(--sub)}
.order .talk{font-size:14px;line-height:1.6;margin-top:4px}
.order .need{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px}
.order .need img{width:28px;height:28px}
.order .need .bar{flex:1;margin:0}
.order .reward{font-size:12px;color:var(--sub);margin-top:6px}
/* 진짜 가게 */
.real{text-align:center;background:#fff1dc;border:2px dashed #d9a35a;padding:14px 12px 4px}
.real .hero{width:100%;max-width:300px;height:auto;border:2px solid var(--line);display:block;margin:0 auto}
.real .rl{font-size:11px;color:var(--sub);margin-top:6px}
.real .rn{font-size:19px;margin:5px 0 6px}
.real .ri{font-size:12px;color:var(--sub);margin-top:3px}
.real .ri a{color:var(--blue)}
.realp{font-size:12px;line-height:1.7;color:var(--sub);margin:12px 2px 0;text-align:center}
/* 이야기 */
.story .chap{display:inline-block;font-size:11px;color:#fff8ee;background:var(--blue);border:2px solid var(--line);padding:4px 8px;margin-bottom:12px}
.say{display:flex;gap:12px;align-items:flex-start;min-height:96px}
.say .portrait{width:60px;height:96px;background:#f6e6cc;border:2px solid var(--line);padding:8px 5px;flex:none;object-fit:contain}
.say .txt{flex:1}
.say .who{font-size:12px;color:var(--sub);margin-bottom:6px}
.say .line{font-size:15px;line-height:1.75}
.say.plain{align-items:center;justify-content:center;text-align:center;padding:10px 6px}
.say.plain .line{color:#5a4636}
.say.help{background:#eaf3fa;border:2px dashed #9cc3e2;padding:10px}
.say.help .who{color:var(--blue)}
.dots{text-align:right;font-size:11px;color:var(--sub);margin-top:8px}
/* 레벨 창 */
.lvhead{display:flex;align-items:center;gap:12px;background:#fff1dc;border:2px dashed #d9a35a;padding:12px}
.lvhead .big{font-size:26px;line-height:1;color:var(--red)}
.lvhead .t{font-size:13px}
.lvhead .s{font-size:11px;color:var(--sub);margin-top:4px}
.quest{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed #ead7c4}
.quest .q{flex:1;font-size:13px}
.quest .q small{display:block;color:var(--sub);font-size:11px;margin-top:3px}
.quest .ck{width:22px;height:22px;border:2px solid var(--line);background:var(--panel);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px}
.quest.done .ck{background:var(--green);color:#fff}
.quest.claimed{opacity:.5}
.att{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.att div{border:2px solid #e2c9a6;background:var(--panel);text-align:center;font-size:10px;padding:6px 0;line-height:1.5;color:var(--sub)}
.att div.got{background:#ffd9cf;border-color:var(--line);color:var(--ink)}
.att div.today{outline:2px solid var(--red);outline-offset:1px}
.road{position:relative;padding-left:24px}
.road::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;border-left:2px dashed #d9bfa0}
.road .st{position:relative;padding:6px 0 8px}
.road .st::before{content:'';position:absolute;left:-22px;top:8px;width:10px;height:10px;background:var(--panel);border:2px solid #c9b29a}
.road .st.past::before{background:var(--green);border-color:var(--line)}
.road .st.now::before{background:var(--red);border-color:var(--line)}
.road .st b{font-size:12px;font-weight:400}
.road .st.now b{color:var(--red)}
.road .st span{display:block;font-size:11px;color:var(--sub);margin-top:2px;line-height:1.55}
.road .st.future{opacity:.75}
.unl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.unl div{display:flex;align-items:center;gap:6px;background:#fff1dc;border:2px solid #e2c9a6;padding:6px 8px;font-size:12px}
.unl img{width:22px;height:22px}
.lvup{text-align:center}
.lvup .num{font-size:40px;color:var(--red);line-height:1.1;margin-top:4px}
.lvup .rk{display:inline-block;margin-top:6px;font-size:12px;background:var(--blue);color:#fff;border:2px solid var(--line);padding:3px 8px}
.lvup .unl{justify-content:center}
.mini-res{text-align:center;padding:6px 0}
.mini-res .sc{font-size:36px;color:var(--red);margin:6px 0}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="stat"><img id="icCoin" alt=""><b id="hudCoins">0</b></div>
    <button class="stat" id="lvBtn"><img id="icStar" alt=""><span>Lv <b id="hudLv">1</b></span><span class="xp"><i id="xpFill"></i></span><span class="qd">할 일 <b id="hudQuest">0/3</b></span><i class="dot" id="dotLv"></i></button>
    <span class="spacer"></span>
    <button class="icon" id="btnSound" aria-label="소리"><img id="icSound" alt=""></button>
    <button class="icon" id="btnHelp" aria-label="도움말"><img id="icHelp" alt=""></button>
  </header>
  <div id="stage"><div id="box"><canvas id="cv"></canvas>
    <div id="pill"><span id="hudName"></span><span id="hudRank"></span></div>
    <button id="miniBtn" hidden><img id="icBasket" alt=""><span id="miniTxt">멸치 받기</span></button>
    <div id="toast"></div></div></div>
  <nav id="bar">
    <button data-open="stock"><img data-ic="box" alt=""><span>창고</span><i class="dot" id="dotStock"></i></button>
    <button data-open="order"><img data-ic="note" alt=""><span>주문</span><i class="dot" id="dotOrder"></i></button>
    <button data-open="up"><img data-ic="hammer" alt=""><span>키우기</span><i class="dot" id="dotUp"></i></button>
    <button data-open="book"><img data-ic="book" alt=""><span>수첩</span><i class="dot" id="dotBook"></i></button>
    <button data-open="real"><img data-ic="shop" alt=""><span>진짜 가게</span><i class="dot" id="dotReal"></i></button>
  </nav>
</div>
<div id="sheet" class="sheet hidden"><div class="sheet-bg"></div><div class="win" id="sheetCard"></div></div>

<script>
/* =========================================================
   실제 가게 정보 — 여기만 바꾸면 게임 전체에 반영돼요
   ========================================================= */
const CONFIG = {
  shopName: '청해진 건어물',         // 게임 속 가게 이름 (간판)
  realShopName: '완도어람건어물',    // 실제 가게 이름 (우리 가게 탭, 엔딩에 표시)
  shopIntro: '게임 속 청해진 건어물은 실제 건어물 가게 완도어람건어물을 모티브로 만들었어요. 게임에서 말리던 건어물, 성남 가게에 오시면 진짜로 만나볼 수 있어요.',
  shopUrl: 'https://naver.me/GSgVA9Op', // 실제 가게 링크 (네이버)
  shopAddress: '경기 성남시 수정구 수정북로 28 1층',
  shopPhone: '010-9437-4367',
  supportAccount: '',                // 비워두면 응원 버튼이 안 보여요
};

/* ---------------- 데이터 ---------------- */
const PRODUCTS = [
  {id:'anchovy', name:'멸치',   price:10,  cost:15,  time:8,  batch:5, unlock:0,     lv:1,  note:'완도 앞바다 멸치, 볶음도 국물도'},
  {id:'miyeok',  name:'미역',   price:24,  cost:40,  time:13, batch:5, unlock:100,   lv:2,  note:'해녀 이모가 물질해서 딴 미역'},
  {id:'dasima',  name:'다시마', price:40,  cost:70,  time:18, batch:5, unlock:500,   lv:4,  note:'국물 맛의 비밀, 하얀 가루는 맛이에요'},
  {id:'gim',     name:'김',     price:70,  cost:120, time:24, batch:5, unlock:2500,  lv:7,  note:'겨울 바다 김발에서 온 김'},
  {id:'squid',   name:'오징어', price:120, cost:220, time:32, batch:5, unlock:12000, lv:11, note:'선장님 배에서 바로 받은 오징어'},
  {id:'abalone', name:'건전복', price:200, cost:350, time:45, batch:5, unlock:40000, lv:15, note:'완도의 자랑, 선물용으로 인기'},
];
const PM = Object.fromEntries(PRODUCTS.map(p=>[p.id,p]));

const UPS = [
  {id:'rack',  name:'건조대 늘리기',    max:4, cost:l=>[80,600,4000,20000][l], desc:()=>`말릴 칸이 하나 늘어요 (${slotCount()}칸)`},
  {id:'fan',   name:'선풍기 놓기',      max:5, cost:l=>Math.round(80*Math.pow(3.4,l)),  desc:()=>'건어물이 10% 더 빨리 말라요'},
  {id:'pack',  name:'예쁜 포장',        max:8, cost:l=>Math.round(150*Math.pow(2.9,l)), desc:()=>'판매가가 15% 올라요'},
  {id:'sign',  name:'간판 꾸미기',      max:6, cost:l=>Math.round(120*Math.pow(3.2,l)), desc:()=>'손님이 더 자주 와요'},
  {id:'staff', name:'알바생 고용',      max:1, cost:()=>600,  desc:()=>'손님을 알아서 응대해요. 자리 비워도 팔아요'},
  {id:'auto',  name:'자동 건조 시스템', max:1, cost:()=>15000, desc:()=>'다 마르면 알아서 거두고 다시 걸어요'},
];
// 가게 꾸미기: 한 번 사면 화면에 보이고, 작은 효과가 붙어요
const DECOS = [
  {id:'pot',     name:'화분',        lv:2,  cost:400,   desc:'손님이 조금 더 오래 기다려줘요'},
  {id:'cushion', name:'치즈 방석',   lv:3,  cost:700,   desc:'치즈가 자주 놀러와서 낮잠을 자요'},
  {id:'chime',   name:'풍경',        lv:5,  cost:2500,  desc:'직접 응대 보너스가 10%에서 20%로'},
  {id:'lights',  name:'줄전구',      lv:8,  cost:6000,  desc:'밤에 손님이 더 자주 와요'},
  {id:'flag',    name:'풍어기',      lv:11, cost:15000, desc:'갈매기가 덜 와요'},
  {id:'signgold',name:'간판 새단장', lv:15, cost:50000, desc:'모든 판매가 5% 올라요'},
];
// 레벨: 번 돈만큼 경험치가 쌓여요
const LV_MAX=30;
const OFFLINE_CAP=3*3600, OFFLINE_RATE=.12, STOCK_CAP=150; // 자리 비운 동안: 최대 3시간, 동수가 받는 손님 비율

const MELODY=[[0,76,2],[2,79,1],[3,81,1],[4,79,2],[6,76,2],
  [8,72,2],[10,74,1],[11,76,1],[12,69,4],
  [16,69,1],[17,72,1],[18,74,2],[20,72,1],[21,69,1],[22,72,2],

  [48,72,2],[50,74,2],[52,76,1],[53,79,1],[54,74,2],
  [56,72,6]];
const CHORDS=[[48,52,55],[45,48,52],[41,45,48],[43,47,50],[48,52,55],[45,48,52],[41,45,48],[48,52,55]];
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(freq,t,dur,type,vol,dest){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.05);
}
function marimba(m,t,len){
  const d=Math.max(.45,len*EIGHTH*1.4);
  tone(mtof(m),t,d,'triangle',.22,BGM.master);
  tone(mtof(m)*4,t,.12,'sine',.04,BGM.master);
}
function scheduleStep(s,t){
  const bar=Math.floor(s/8),beat=s%8;
  for(const [st,m,len] of MELODY)if(st===s)marimba(m,t,len);
  let ch=CHORDS[bar];if(bar===6&&beat>=4)ch=[43,47,50];
  const arp=[0,2,1,2,0,2,1,2][beat];
  tone(mtof(ch[arp]+12),t,.35,'sine',.07,BGM.master);
  if(beat===0||beat===4)tone(mtof(ch[0]-12),t,EIGHTH*3.5,'triangle',.16,BGM.master);
  if(beat%2===1)tone(5200,t,.03,'square',.006,BGM.master);
}
function startWaves(){
  const len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=480;
  const g=AC.createGain();g.gain.value=.05;
  const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.11;lg.gain.value=.045;
  lfo.connect(lg);lg.connect(g.gain);
  src.connect(lp);lp.connect(g);g.connect(BGM.master);src.start();lfo.start();
  BGM.wave=[src,lfo];
}
function bgmStart(){
  if(!S.bgm||BGM.playing||!ensureAC())return;
  BGM.master=AC.createGain();BGM.master.connect(AC.destination);
  BGM.master.gain.setValueAtTime(0,AC.currentTime);BGM.master.gain.linearRampToValueAtTime(.55,AC.currentTime+1.5);
  BGM.playing=true;BGM.step=0;BGM.next=AC.currentTime+.1;
  startWaves();
  BGM.timer=setInterval(()=>{
    if(BGM.next<AC.currentTime-.05)BGM.next=AC.currentTime+.05;
    while(BGM.next<AC.currentTime+.3){scheduleStep(BGM.step,BGM.next);BGM.next+=EIGHTH;BGM.step=(BGM.step+1)%64;
      if(BGM.step===0)BGM.next+=EIGHTH*2;}
  },80);
}
function bgmStop(){
  if(!BGM.playing)return;
  clearInterval(BGM.timer);BGM.playing=false;if(silentEl)silentEl.pause();
  const m=BGM.master,w=BGM.wave;
  m.gain.cancelScheduledValues(AC.currentTime);m.gain.setValueAtTime(m.gain.value,AC.currentTime);m.gain.linearRampToValueAtTime(0,AC.currentTime+.6);
  setTimeout(()=>{try{w.forEach(n=>n.stop());m.disconnect()}catch(e){}},700);
}

function hang(i,pid){

  if(S.coins<p.cost){toast('재료비가 모자라요');return false}
  S.coins-=p.cost;sl.p=pid;sl.t=0;sl.done=false;S.lastPid=pid;blip(660,.06);return true;
}
function collect(i,auto){
  const sl=S.slots[i],p=PM[sl.p],pos=slotPos(i);
  S.stock[p.id]+=p.batch;
  parts.push({x:pos.x+5,y:pos.line+2,text:`+${p.batch} ${p.name}`,color:'#ffffff',t:0,life:1.2});
  if(!auto){blip(784,.08,'triangle');dq('collect')}

  else{sl.p=null;sl.t=0;sl.done=false;if(!auto)toast('재료비가 모자라서 빈칸으로 둘게요')}
}

/* ---------------- 업데이트 ---------------- */
function update(dt){
  S.clock+=dt;
  for(let i=0;i<slotCount();i++){
    const sl=S.slots[i];
    if(sl.p&&!sl.done){sl.t+=dt;if(sl.t>=timeEff(PM[sl.p])){sl.done=true;if(S.up.auto&&S.stock[sl.p]<STOCK_CAP)collect(i,true)}}
    else if(sl.p&&sl.done&&S.up.auto&&S.stock[sl.p]<STOCK_CAP&&Math.random()<.02)collect(i,true);
  }
  spawnT-=dt;
  if(spawnT<=0){spawnT=spawnInt()*rand(.7,1.3);spawnCustomer()}
  for(const c of customers){
    c.bob+=dt*8;
    if(c.state==='in'){
      if(c.phase==='walk'){const d=c.tx-c.x;c.x+=Math.sign(d)*Math.min(Math.abs(d),30*dt);if(Math.abs(d)<.5){c.x=c.tx;c.phase='up'}}
      else{c.y-=20*dt;if(c.y<=141){c.y=141;c.state='wait';keeperWave=1}}
    }else if(c.state==='wait'){
      c.pat+=dt;
      if(S.up.staff){c.serveT+=dt;if(c.serveT>2.2&&S.stock[c.want]>0)serve(c,false)}
      if(c.pat>c.maxPat&&c.state==='wait')leave(c,'angry');
    }else{
      c.moodT-=dt;
      if(c.phase==='down'){c.y+=20*dt;if(c.y>=156){c.y=156;c.phase='walk'}}
      else c.x+=Math.sign(c.exit-c.x)*32*dt;
    }
  }
  customers=customers.filter(c=>!(c.state==='out'&&(c.x<-14||c.x>W+14)));

  // 갈매기
  gullT-=dt;
  if(gullT<=0&&!gull){
    gullT=rand(45,85)*(S.deco.flag?1.8:1)*(S.eggs.gull?1.5:1);
    const occ=[...Array(slotCount()).keys()].filter(i=>S.slots[i].p);
    if(occ.length){const top=occ.filter(i=>i<3);const i=pick(top.length?top:occ);const p=slotPos(i);
      gull={x:W+12,y:4,tx:p.x-1,ty:p.line-6,slot:i,state:'in',t:0,carry:null};queueStory('gull1')}
  }
  if(gull){
    gull.t+=dt;
    if(gull.state==='in'){
      const dx=gull.tx-gull.x,dy=gull.ty-gull.y,dist=Math.hypot(dx,dy),sp=16*dt;
      if(dist<=sp){
        const sl=S.slots[gull.slot];
        if(sl.p){gull.carry=sl.p;toast(`앗, 갈매기가 ${PM[sl.p].name}를 물고 갔어요`);sl.p=null;sl.t=0;sl.done=false;blip(300,.15,'sawtooth',.03)}
        gull.state='flee';
      }else{gull.x+=dx/dist*sp;gull.y+=dy/dist*sp}
    }else{gull.x+=55*dt;gull.y-=35*dt;if(gull.y<-14||gull.x>W+14)gull=null}
  }

  // 고양이
  catT-=dt;
  if(catT<=0&&!cat&&!nap){
    catT=rand(60,110);
    const any=PRODUCTS.some(p=>S.stock[p.id]>0)||[3,4,5].some(i=>i<slotCount()&&S.slots[i].p);
    if(any){cat={x:-14,y:162,state:'in',t:0,carry:null};queueStory('cat1')}
  }
  if(cat){
    cat.t+=dt;
    if(cat.state==='in'){
      cat.x+=13*dt;
      if(cat.x>=134){
        const occ=[3,4,5].filter(i=>i<slotCount()&&S.slots[i].p);
        if(occ.length){const i=pick(occ);cat.carry=S.slots[i].p;toast(`냥! 고양이가 ${PM[cat.carry].name}를 물고 도망갔어요`);S.slots[i].p=null;S.slots[i].t=0;S.slots[i].done=false}
        else{const st=PRODUCTS.filter(p=>S.stock[p.id]>0);if(st.length){const p=pick(st);S.stock[p.id]-=Math.min(2,S.stock[p.id]);cat.carry=p.id;toast(`냥! 고양이가 ${p.name}를 슬쩍했어요`)}}
        cat.state='flee';blip(500,.1,'triangle');
      }
    }else{cat.x-=45*dt;if(cat.x<-16)cat=null}
  }

  // 지나가는 행인 (장날엔 더 많이)
  walkT-=dt;
  if(walkT<=0){walkT=fest?rand(1.5,3):rand(6,13);const r=Math.random()<.5;
    walkers.push({x:r?-8:W+8,dir:r?1:-1,y:rand(166,170),sp:rand(14,22),bob:0,pal:{c:pick(SHIRTS),h:pick(HAIRS),d:pick(PANTS)}})}
  for(const w of walkers){w.x+=w.dir*w.sp*dt;w.bob+=dt*8}
  walkers=walkers.filter(w=>w.x>-12&&w.x<W+12);

  // 치즈 낮잠 (방석이 있으면 자주)
  if(!nap&&!cat){napT-=dt;if(napT<=0&&S.story.cat1){nap={t:0,dur:rand(30,60)};napT=S.deco.cushion?rand(20,40):rand(60,110)}}
  if(nap){nap.t+=dt;if(nap.t>nap.dur)nap=null}

  // 장날
  festT-=dt;
  if(!fest&&festT<=0){fest={t:0,dur:60};toast('오늘은 완도 장날! 손님이 몰려와요 (판매가 +20%)');fanfare();spawnT=.5}
  if(fest){fest.t+=dt;if(fest.t>=fest.dur){fest=null;festT=rand(200,320);toast('장날이 끝났어요. 수고했어요!')}}

  // 단골 주문
  if(!S.order&&S.story.prologue){orderT-=dt;if(orderT<=0)newOrder()}

  for(const p of parts){p.t+=dt;p.y-=14*dt}
  parts=parts.filter(p=>p.t<p.life);
  for(const c of coins){c.t+=dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.vy+=120*dt}
  coins=coins.filter(c=>c.t<c.life);
  for(const c of confetti){c.t+=dt;c.y+=c.vy*dt;c.x+=c.vx*dt+Math.sin(c.t*6)*.3}
  confetti=confetti.filter(c=>c.y<H+BOT+4);
  if(celebrate){celebrate.t+=dt;if(celebrate.t>1.6)celebrate=null}
  if(keeperWave>0)keeperWave-=dt;
  if(staffBow>0)staffBow-=dt;
  if(signAlt>0)signAlt-=dt;if(dance>0)dance-=dt;if(sunBoost>0)sunBoost-=dt;if(sunCool>0)sunCool-=dt;if(moonCool>0)moonCool-=dt;if(boatHonk>0)boatHonk-=dt;
  if(star){star.t+=dt;if(star.t>1.2)star=null}
  if(dolphinHi){dolphinHi.t+=dt;if(dolphinHi.t>1.5)dolphinHi=null}
  if(S.shooed>=30&&!S.eggs.gull)findEgg('gull','깍깍이가 항복했어요. 이제 갈매기가 덜 와요');
  if(S.pets>=20&&!S.eggs.cheese)findEgg('cheese','치즈가 왕관을 쓰고 명예 직원이 됐어요');
  // 꽃게가 가끔 길을 가로질러요
  crabT-=dt;if(!crab&&crabT<=0){crabT=rand(40,80);const r=Math.random()<.5;crab={x:r?-8:W+8,dir:r?1:-1,t:0,home:false}}
  if(crab){crab.t+=dt;crab.x+=crab.dir*(crab.home?40:9)*dt;if(crab.x<-10||crab.x>W+10)crab=null}
  // 돌고래가 가끔 바다에서 뛰어올라요
  dolphinT-=dt;if(!dolphin&&dolphinT<=0){dolphinT=rand(25,50);dolphin={x:rand(20,150),t:0}}
  if(dolphin){dolphin.t+=dt;if(dolphin.t>1.6)dolphin=null}
  // 쉬러 온 갈매기 (건조대 기둥 위에 잠깐 앉아 있어요)
  perchT-=dt;if(!perch&&!gull&&perchT<=0){perchT=rand(30,60);perch={t:0,dur:rand(12,25)}}
  if(perch){perch.t+=dt;if(perch.t>perch.dur||gull)perch=null}
  updateScenery(dt);
  if(say){say.t-=dt;if(say.t<=0)say=null}
  saveT+=dt;if(saveT>5){saveT=0;save()}
}

function drawBubble(cx,by,w,h){
  cx=Math.round(cx);by=Math.round(by);w=Math.round(w);

}

function closeSheet(){$('#sheet').classList.add('hidden');curWin=null;if(storyCur)finishStory()}
const sheetOpen=()=>!$('#sheet').classList.contains('hidden');

/* 이야기 */
let storyQ=[],storyCur=null,storyIdx=0;const _portrait={};
function portraitURL(who){return _portrait[who]||(_portrait[who]=iconURL('person',5,CAST[who].pal))}
function queueStory(id){if(!STORY[id]||S.story[id]||storyQ.includes(id)||(storyCur&&storyCur.id===id))return;storyQ.push(id)}
function pumpStory(){
  if(storyCur||!storyQ.length||sheetOpen()||lvPending||mini)return;
  storyCur={id:storyQ.shift(),replay:false};storyIdx=0;renderStory();
}
function playStory(id){storyCur={id,replay:true};storyIdx=0;renderStory()}
function finishStory(){const st=storyCur;storyCur=null;if(!st.replay)S.story[st.id]=1;save()}
function renderStory(){
  const st=STORY[storyCur.id],[who,text]=st.lines[storyIdx],c=CAST[who],last=storyIdx===st.lines.length-1;
  $('#sheetCard').innerHTML=`<div class="win-b"><div class="story"><div class="chap">${st.title}</div>
    <div class="say ${c.pal?'':'plain'} ${who==='help'?'help':''}">
      ${c.pal?`<img class="portrait" src="${portraitURL(who)}">`:''}
      <div class="txt">${c.name?`<div class="who">${c.name}</div>`:''}<div class="line">${text}</div></div></div>
    <div class="dots">${storyIdx+1} / ${st.lines.length}</div>
    ${last&&storyCur.id==='ending'?`<button class="btn red big" data-act="visit">진짜 가게 구경하러 가기</button>`:''}
    <button class="btn big" data-act="storynext">${last?'닫기':'다음'}</button></div></div>`;
  if(!sheetOpen()){$('#sheet').classList.remove('hidden');sheetOpenedAt=performance.now()}
  blip(600+storyIdx*40,.04,'triangle',.025);
}
function checkMilestones(){
  if(celebrate||lvPending)return;
  if(S.level>=4)queueStory('rank1');
  if(S.level>=8)queueStory('rank2');
  if(S.level>=13)queueStory('rank3');
  if(S.level>=20)queueStory('ending');
}
$('#sheet .sheet-bg').addEventListener('click',()=>{if(performance.now()-sheetOpenedAt>450)closeSheet()});

/* 레벨 보상 */
const STORY_AT={4:'새 이야기: 소문',8:'새 이야기: 섬마을 명물',13:'새 이야기: 서울에서 온 주문',20:'에필로그'};
function rewardsAt(L){
  const r=[];
  for(const p of PRODUCTS)if(p.lv===L&&L>1)r.push({im:ICONS[p.id],t:`새 상품 ${p.name}`});
  for(const d of DECOS)if(d.lv===L)r.push({im:ic('icGift'),t:`꾸미기 ${d.name}`});
  for(const [l,,t] of SCENE_UNLOCKS)if(l===L)r.push({im:ic('icSea'),t});
  for(const [l,,t] of FEATURE_UNLOCKS)if(l===L)r.push({im:ic('icBasket'),t});
  for(const [l,t] of RANKS)if(l===L&&L>1)r.push({im:ic('icStar'),t:`칭호 '${t}'`});
  if(STORY_AT[L])r.push({im:ic('icBook'),t:STORY_AT[L]});
  return r;
}
function nextGoal(L){for(let l=L+1;l<=LV_MAX;l++){const r=rewardsAt(l);if(r.length)return {l,r}}return null}
function pumpLevelUp(){
  if(!lvPending||celebrate||sheetOpen()||storyCur||mini)return;
  const {from,to,bonus}=lvPending;lvPending=null;
  let got=[];for(let l=from+1;l<=to;l++)got=got.concat(rewardsAt(l));
  const rkNew=rankName(to)!==rankName(from)?rankName(to):null,ng=nextGoal(to);
  openSheet(winHTML('레벨 업!',`<div class="lvup"><div class="num">Lv ${to}</div>${rkNew?`<div class="rk">${rkNew}</div>`:''}
    <div class="notice">레벨 보너스 +${fmt(bonus)}원</div>
    ${got.length?`<div class="sec">새로 열렸어요</div><div class="unl">${got.map(g=>`<div><img src="${g.im}" alt="">${g.t}</div>`).join('')}</div>`:''}
    ${ng?`<div class="sec">다음 목표 Lv ${ng.l}</div><div class="unl">${ng.r.map(g=>`<div style="opacity:.75"><img src="${g.im}" alt="">${g.t}</div>`).join('')}</div>`:''}
    <button class="btn red big" data-act="close">좋아요!</button></div>`,'icStar'));
}

/* 오늘의 할 일, 출석 */
function dayKey(d=new Date()){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function ensureDaily(){
  const today=dayKey();if(S.daily&&S.daily.day===today)return;
  const cnt=hasFeat('quest4')?4:3,pool=QUESTS.filter(q=>!q.need||q.need()),qs=[];
  while(qs.length<cnt&&pool.length){const q=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    const it={k:q.k,n:q.n(S.level),prog:0,done:false};
    if(q.pid){const un=PRODUCTS.filter(p=>S.unlocked[p.id]);it.pid=pick(un).id}
    qs.push(it)}
  S.daily={day:today,quests:qs,chest:false,plays:0};save();
}
const qText=q=>{const d=QUESTS.find(x=>x.k===q.k);return d.t(q.n,q.pid)};
const qReward=()=>({coins:15+S.level*8,xp:Math.round(needXP(S.level)*.05)});
function dq(k,arg,n=1){
  if(!S.daily)return;
  for(const q of S.daily.quests){if(q.k!==k||q.done)continue;if(q.pid&&q.pid!==arg)continue;
    q.prog=Math.min(q.n,q.prog+n);
    if(q.prog>=q.n){q.done=true;const r=qReward();S.coins+=r.coins;addXP(r.xp);coinBurst(90,40,8);
      toast(`할 일 완료! ${qText(q)} (+${fmt(r.coins)}원, 경험치 +${fmt(r.xp)})`);blip(1046,.08,'triangle');setTimeout(()=>blip(1318,.1,'triangle'),90)}}
}
const questDone=()=>S.daily?S.daily.quests.filter(q=>q.done).length:0;
const chestReady=()=>S.daily&&!S.daily.chest&&questDone()===S.daily.quests.length;
function openChest(){
  if(!chestReady())return;S.daily.chest=true;
  const c=60+S.level*25,xp=Math.round(needXP(S.level)*.12);S.coins+=c;addXP(xp);sunBoost=Math.max(sunBoost,60);
  fanfare();coinBurst(90,60,14);save();
  openSheet(winHTML('보상 상자',`<div class="mini-res"><img src="${iconURL('icChest',9)}" style="width:90px" alt="">
    <div class="notice">+${fmt(c)}원, 경험치 +${fmt(xp)}<br>햇살 버프 60초 (건어물이 두 배로 빨리 말라요)</div></div>
    <button class="btn red big" data-act="close">좋아요!</button>`,'icChest'));
}
let attPending=false;
function checkAttendance(){
  const today=dayKey();if(S.att.last===today||!S.story.prologue)return;
  attPending=true;
}
function pumpAttendance(){
  if(!attPending||sheetOpen()||storyCur||lvPending||mini)return;attPending=false;
  const today=dayKey();if(S.att.last===today)return;
  const idx=S.att.count%7,amt=Math.round(ATT[idx]*(1+.15*(S.level-1)));
  S.att.last=today;S.att.count++;S.coins+=amt;let extra='';
  if(idx===6){const xp=Math.round(needXP(S.level)*.1);addXP(xp);sunBoost=Math.max(sunBoost,120);extra=`<br>7일째 선물: 경험치 +${fmt(xp)}, 햇살 버프 2분`}
  save();fanfare();
  openSheet(winHTML(`출석 ${idx+1}일째`,`<div class="att">${ATT.map((a,i)=>`<div class="${i<=idx?'got':''} ${i===idx?'today':''}">${i+1}일<br>${i===6?'선물':Math.round(a*(1+.15*(S.level-1)))}</div>`).join('')}</div>
    <div class="notice" style="margin-top:12px">${fmt(amt)}원을 받았어요!${extra}</div>
    <div class="sub">오늘의 할 일 ${S.daily.quests.length}개가 새로 나왔어요. 위쪽 Lv 버튼에서 볼 수 있어요.</div>
    <button class="btn red big" data-act="close">고마워요</button>`,'icCoin'));
}

    <small style="margin:0 0 0 4px">${next?`판매 ${sold}/${next[0]}`:'도장 완성!'}</small></div>`;
}

function shopShot(){
  try{const c=document.createElement('canvas'),sx=0,sy=Math.max(0,TOPX-2),sw=134,sh=150;c.width=sw*SC;c.height=sh*SC;
    c.getContext('2d').drawImage(cv,sx*SC,sy*SC,sw*SC,sh*SC,0,0,sw*SC,sh*SC);return c.toDataURL()}catch(e){return iconURL('icShop',12)}
}
function openWin(type,t){
  const w=WINS[type];curWin={type,tab:t||(w.tabs?w.tabs[0][0]:null),sig:''};
  if(type==='real'&&!S.realSeen){S.realSeen=true;save()}
  if(type==='book')S.bookSeen=Object.keys(S.eggs).length+Object.keys(S.story).length;
  openSheet(winHTML(w.title,'',w.ic));renderWin(true);
}
function winSig(){return curWin.type+curWin.tab+Math.floor(S.coins)+JSON.stringify(S.stock)+JSON.stringify(S.up)+JSON.stringify(S.deco)+JSON.stringify(S.order)+S.level+Math.floor(S.xp/50)+JSON.stringify(S.daily)+Object.keys(S.eggs).length+Object.keys(S.story).length+JSON.stringify(S.unlocked)+S.bgm+S.sound}
function renderWin(force){
  if(!curWin||!sheetOpen())return;
  const sg=winSig();if(!force&&sg===curWin.sig)return;curWin.sig=sg;
  const w=WINS[curWin.type],b=$('#sheetCard .win-b');if(!b)return;const sc=b.scrollTop;
  b.innerHTML=(w.tabs?`<div class="itabs">${w.tabs.map(([k,l])=>`<button class="${k===curWin.tab?'on':''}" data-act="itab" data-id="${k}">${l}</button>`).join('')}</div>`:'')+w.body(curWin.tab);
  b.scrollTop=sc;
}

document.addEventListener('click',e=>{
  const ob=e.target.closest('[data-open]');if(ob){openWin(ob.dataset.open);blip(760,.04,'triangle',.03);return}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  if(b.closest('#sheet')&&performance.now()-sheetOpenedAt<300)return;
  const a=b.dataset.act,id=b.dataset.id,slot=+b.dataset.slot;
  if(a==='close')closeSheet();
  else if(a==='itab'){curWin.tab=id;renderWin(true);$('#sheetCard .win-b').scrollTop=0;return}
  else if(a==='storynext'){if(storyIdx<STORY[storyCur.id].lines.length-1){storyIdx++;renderStory()}else closeSheet();return}
  else if(a==='replay'){playStory(id);return}
  else if(a==='tbgm'){S.bgm=!S.bgm;if(S.bgm){unlockAudio()}else bgmStop();save();refreshSoundBtn()}
  else if(a==='tsfx'){S.sound=!S.sound;if(S.sound)blip(880,.06);save();refreshSoundBtn()}
  else if(a==='hang'){if(hang(slot,id))closeSheet()}
  else if(a==='clear'){const sl=S.slots[slot];sl.p=null;sl.t=0;sl.done=false;closeSheet()}
  else if(a==='unlock'){const p=PM[id];if(S.coins>=p.unlock&&S.level>=p.lv){S.coins-=p.unlock;S.unlocked[id]=true;toast(`${p.name}를 들여왔어요! 건조대에 걸어보세요`);sfxCoin();queueStory(id);save();closeSheet()}}
  else if(a==='up'){const u=UPS.find(x=>x.id===id),l=S.up[id],c=u.cost(l);if(l<u.max&&S.coins>=c){S.coins-=c;S.up[id]++;toast(`${u.name} 완료!`);sfxCoin();coinBurst(90,70,8);if(id==='staff')queueStory('staff');save()}}
  else if(a==='deliver'){deliverOrder();closeSheet()}
  else if(a==='skip'){skipOrder()}
  else if(a==='deco'){const d=DECOS.find(x=>x.id===id);if(d&&!S.deco[id]&&S.level>=d.lv&&S.coins>=d.cost){S.coins-=d.cost;S.deco[id]=1;toast(`${d.name}을 설치했어요!`);sfxCoin();coinBurst(90,60,8);save()}}
  else if(a==='chest'){openChest();return}
  else if(a==='mini'){startMini();return}
  else if(a==='visit'){if(CONFIG.shopUrl)window.open(CONFIG.shopUrl,'_blank');else toast('가게 링크는 곧 열려요!')}
  else if(a==='support'){navigator.clipboard&&navigator.clipboard.writeText(CONFIG.supportAccount);toast('계좌번호를 복사했어요. 응원 감사합니다!')}
  else if(a==='reset'){curWin=null;openSheet(winHTML('처음부터 다시 할까요?',`<div class="sub">모은 돈과 가게 성장 기록이 모두 사라져요.</div>
    <button class="btn red big" data-act="reset2">네, 다시 할래요</button><button class="btn ghost big" data-act="close">아니요</button>`));return}
  else if(a==='reset2'){S=fresh();customers=[];gull=null;cat=null;nap=null;fest=null;storyQ=[];lvPending=null;orderT=12;save();closeSheet();queueStory('prologue');return}
  renderWin(true);
});
$('#lvBtn').addEventListener('click',()=>{openWin('level');blip(760,.04,'triangle',.03)});
$('#btnHelp').addEventListener('click',()=>openWin('help'));
$('#btnSound').addEventListener('click',()=>openWin('sound'));
$('#miniBtn').addEventListener('click',startMini);
function refreshSoundBtn(){$('#icSound').src=ic(S.sound||S.bgm?'icSound':'icMute')}
// 픽셀 아이콘 붙이기
$('#icCoin').src=ic('icCoin');$('#icStar').src=ic('icStar');$('#icHelp').src=ic('icHelp');$('#icBasket').src=ic('icBasket');
document.querySelectorAll('#bar img[data-ic]').forEach(im=>im.src=ic({box:'icBox',note:'icNote',hammer:'icHammer',book:'icBook',shop:'icShop'}[im.dataset.ic]));
refreshSoundBtn();
$('#hudName').textContent=CONFIG.shopName;
function updateDots(){
  const ord=!!orderReady(),stk=PRODUCTS.some(p=>!S.unlocked[p.id]&&S.level>=p.lv&&S.coins>=p.unlock),
    up=DECOS.some(d=>!S.deco[d.id]&&S.level>=d.lv&&S.coins>=d.cost)||UPS.some(u=>S.up[u.id]<u.max&&S.coins>=u.cost(S.up[u.id])),
    bk=Object.keys(S.eggs).length+Object.keys(S.story).length>S.bookSeen,lv=chestReady(),rl=!S.realSeen;
  const k=''+ord+stk+up+bk+lv+rl;if(k===updateDots.k)return;updateDots.k=k;
  $('#dotOrder').classList.toggle('on',ord);$('#dotStock').classList.toggle('on',stk);$('#dotUp').classList.toggle('on',up);
  $('#dotBook').classList.toggle('on',bk);$('#dotLv').classList.toggle('on',lv);$('#dotReal').classList.toggle('on',rl);
}

/* ---------------- 자리 비운 동안 ---------------- */
function applyOffline(){
  const now=Date.now();let el=(now-(S.lastSave||now))/1000;
  if(el<60)return;
  el=Math.min(el,OFFLINE_CAP);
  let made=0,spent=0,earned=0,sold=0;
  for(let i=0;i<slotCount();i++){
    const sl=S.slots[i];if(!sl.p)continue;const p=PM[sl.p],te=timeEff(p);
    if(S.up.auto){
      // 가진 돈만큼만 재료를 사고, 창고가 가득 차면 멈춰요
      const rem=el+sl.t,room=Math.max(0,Math.floor((STOCK_CAP-S.stock[p.id])/p.batch)),afford=Math.floor((S.coins-spent)/p.cost);
      const cyc=Math.max(0,Math.min(Math.floor(rem/te),room,afford));
      S.stock[p.id]+=cyc*p.batch;made+=cyc*p.batch;spent+=cyc*p.cost;
      if(cyc<Math.floor(rem/te)){sl.t=te;sl.done=true}else{sl.t=rem-cyc*te;sl.done=false}}
    else{sl.t=Math.min(te,sl.t+el);if(sl.t>=te)sl.done=true}
  }
  if(S.up.staff){
    let demand=Math.floor(el/spawnInt()*2*OFFLINE_RATE);
    const ids=PRODUCTS.filter(p=>S.stock[p.id]>0).map(p=>p.id).sort((a,b)=>PM[b].price-PM[a].price);
    while(demand>0&&ids.some(id=>S.stock[id]>0)){for(const id of ids){if(demand<=0)break;if(S.stock[id]>0){S.stock[id]--;demand--;sold++;S.sold[id]=(S.sold[id]||0)+1;earned+=priceEff(PM[id])}}}
    S.served+=Math.round(sold/2);
  }
  S.coins=Math.max(0,S.coins+earned-spent);S.totalEarned+=earned;addXP(earned);
  S.clock+=el;
  const h=Math.floor(el/3600),m=Math.floor(el%3600/60);
  const done=[...Array(slotCount()).keys()].filter(i=>S.slots[i].done).length;
  if(earned>0||made>0||done>0){
    openSheet(winHTML('다녀오셨어요!',`<div class="hint">${h?h+'시간 ':''}${m}분 동안 가게는 이렇게 지냈어요.</div>
      ${sold?`<div class="row"><div class="info"><b>알바생이 판 건어물 ${fmt(sold)}개</b><small>매출 ${fmt(earned)}원</small></div></div>`:''}
      ${made?`<div class="row"><div class="info"><b>새로 말린 건어물 ${fmt(made)}개</b><small>재료비 ${fmt(spent)}원</small></div></div>`:''}
      ${done?`<div class="row"><div class="info"><b>다 마른 칸 ${done}개</b><small>건조대를 눌러 거둬주세요</small></div></div>`:''}
      <button class="btn red big" data-act="close">가게 문 열기</button>`,'icShop'));
  }
}

/* ---------------- 시작 ---------------- */
let last=performance.now(),coinShown=-1,hudLvShown=-1,xpShown=-1,owlChecked=false,qShown='',miniShown=null;
function loop(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(mini)updateMini(dt);else if(!storyCur)update(dt);
  if(dayKey()!==(S.daily&&S.daily.day))ensureDaily();
  if(!attPending&&S.story.prologue&&S.att.last!==dayKey())attPending=true;
  checkMilestones();pumpLevelUp();pumpAttendance();pumpStory();
  if(!owlChecked&&S.story.prologue&&!storyCur&&!sheetOpen()){owlChecked=true;const h=new Date().getHours();if(h<4)findEgg('owl','이 늦은 시간까지 가게를... 할머니가 걱정하시겠어요',100)}
  draw();
  if(Math.floor(S.coins)!==coinShown){coinShown=Math.floor(S.coins);$('#hudCoins').textContent=fmt(S.coins)}
  if(hudLvShown!==S.level){hudLvShown=S.level;$('#hudLv').textContent=S.level;$('#hudRank').textContent=rankName()}
  const qs=S.daily?questDone()+'/'+S.daily.quests.length:'';if(qs!==qShown){qShown=qs;$('#hudQuest').textContent=qs}
  const ml=hasFeat('mini')&&!mini?miniLeft():0,mt=ml?`멸치 받기 ${ml}`:'';if(mt!==miniShown){miniShown=mt;$('#miniBtn').hidden=!ml;$('#miniTxt').textContent=mt}
  $('#pill').style.visibility=mini?'hidden':'visible';
  const xw=S.level>=LV_MAX?100:Math.min(100,S.xp/needXP(S.level)*100);
  if(Math.abs(xw-xpShown)>.3){xpShown=xw;$('#xpFill').style.width=xw.toFixed(1)+'%'}
  renderWin(false);updateDots();
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){save();if(AC)AC.suspend();if(silentEl)silentEl.pause()}
  else{last=performance.now();if(AC)AC.resume().catch(()=>{});if(silentEl&&BGM.playing)silentEl.play().catch(()=>{});applyOffline()}
});
window.addEventListener('pagehide',save);

ensureDaily();checkAttendance();
applyOffline();
queueStory('prologue');
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
resize();
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{resize();requestAnimationFrame(loop)});
</script>
